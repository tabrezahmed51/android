name: Static Checks & Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Format code
        run: npx prettier --write .

  detect-language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect languages
        uses: github/linguist@v7

  advanced-output:
    runs-on: ubuntu-latest
    needs: [autoformat, detect-language]
    steps:
      - name: Show Job Results
        run: echo "Auto-format and language detection jobs were successful!"

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{{{ steps.deployment.outputs.page_url }}}}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
